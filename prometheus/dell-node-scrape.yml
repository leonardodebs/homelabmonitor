# Job de scrape do Node Exporter instalado no Dell.
scrape_configs:
  - job_name: node-dell
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "192.168.100.2:9100"
        labels:
          instance: homelab-dell
          server: dell
          site: homelab
